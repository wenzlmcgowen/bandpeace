<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0f12">
<title>🐼 HQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f12'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E%F0%9F%90%BC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="hq.css">
</head>
<body>

<div id="app">

  <!-- Demo banner (demo mode only) -->
  <div id="demo-banner" class="demo-banner" hidden>DEMO — fake data, changes don't save</div>

  <!-- State 1 / 3: no key (or wrong key) — an easter egg, nothing more -->
  <section id="state-tease" class="center-state" hidden>
    <div class="tease-panda" aria-hidden="true">🐼</div>
    <p class="tease-text">nothing to see here.</p>
  </section>

  <!-- State 2: key is fine, engine not plugged in yet -->
  <section id="state-noengine" class="center-state" hidden>
    <div class="friendly-card">
      <div class="friendly-emoji" aria-hidden="true">🐼</div>
      <p>The board engine isn't plugged in yet — Wenzl has one setup step
      to run (<code>board-backend/setup-board.command</code>).</p>
    </div>
  </section>

  <!-- Live: first load -->
  <section id="state-loading" class="center-state" hidden>
    <div class="loading-panda" aria-hidden="true">🐼</div>
    <p class="loading-text">waking the board…</p>
  </section>

  <!-- Live: fetch failed with nothing to show -->
  <section id="state-retry" class="center-state" hidden>
    <div class="friendly-card">
      <div class="friendly-emoji" aria-hidden="true">🐼</div>
      <p>Can't reach the board right now.</p>
      <button id="retry-btn" class="retry-btn" type="button">try again</button>
    </div>
  </section>

  <!-- Landing: team picker -->
  <section id="view-landing" hidden>
    <header class="hq-header">
      <h1 class="hq-title"><span aria-hidden="true">🐼</span> PSYCHO PANDA HQ</h1>
    </header>
    <main class="landing-main">
      <div id="tile-grid" class="tile-grid"></div>
    </main>
  </section>

  <!-- Board: one person's (or Master's) card stack -->
  <section id="view-board" hidden>
    <header class="hq-header board-header">
      <button id="back-btn" class="icon-btn" type="button" aria-label="Back to team picker">←</button>
      <h1 id="board-title" class="board-title"></h1>
      <button id="refresh-btn" class="icon-btn refresh-btn" type="button" aria-label="Refresh">↻</button>
    </header>
    <main class="board-main">
      <div id="card-stack" class="card-stack"></div>
    </main>
    <button id="add-btn" class="add-btn" type="button" aria-label="Add a task">+</button>
  </section>

  <!-- Add-task sheet -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden>
    <form id="add-sheet" class="add-sheet">
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 class="sheet-title">New task</h2>
      <label class="sheet-label" for="add-title">What needs doing?</label>
      <input id="add-title" class="sheet-input" type="text" autocomplete="off"
             maxlength="200" placeholder="e.g. Confirm the venue" required>
      <div class="sheet-row">
        <div class="sheet-field">
          <label class="sheet-label" for="add-deadline">Deadline <span class="sheet-opt">(optional)</span></label>
          <input id="add-deadline" class="sheet-input" type="date">
        </div>
        <div class="sheet-field">
          <label class="sheet-label" for="add-owner">Who's on it?</label>
          <select id="add-owner" class="sheet-input"></select>
        </div>
      </div>
      <div class="sheet-actions">
        <button type="button" id="sheet-cancel" class="sheet-btn ghost">cancel</button>
        <button type="submit" id="sheet-save" class="sheet-btn primary">add it</button>
      </div>
    </form>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" hidden></div>

</div>

<!-- ── templates ─────────────────────────────────────────────────── -->

<template id="tpl-tile">
  <button class="tile" type="button">
    <span class="tile-emoji" aria-hidden="true"></span>
    <span class="tile-name"></span>
    <span class="tile-badge" hidden></span>
  </button>
</template>

<template id="tpl-card">
  <article class="card">
    <div class="card-main">
      <div class="card-body" role="button" tabindex="0">
        <h3 class="card-title"></h3>
        <div class="card-chips"></div>
        <p class="card-stamp" hidden></p>
      </div>
      <button class="done-circle" type="button">
        <svg class="check" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M5 12.5l4.6 4.6L19 7.5" fill="none" stroke="currentColor"
                stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="card-drawer" hidden>
      <p class="drawer-details" hidden></p>
      <p class="drawer-notes" hidden></p>
      <p class="drawer-meta"></p>
    </div>
  </article>
</template>

<template id="tpl-divider">
  <div class="done-divider" aria-hidden="true">
    <span class="done-divider-line"></span>
    <span class="done-divider-label">done ✓</span>
    <span class="done-divider-line"></span>
  </div>
</template>

<script src="config.js"></script>
<script src="hq.js"></script>
</body>
</html>
